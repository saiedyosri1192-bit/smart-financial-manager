<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدير المالي والمحاسبي الذكي - التردد الآلي المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');
        * { font-family: 'Tajawal', sans-serif; }
        body { background: #f0f2f5; }
        .sidebar { transition: all 0.3s ease; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); }
        .nav-item.active { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .table-row:hover { background: #f8fafc; }
        .modal { backdrop-filter: blur(5px); }
        .import-zone { border: 2px dashed #cbd5e1; transition: all 0.3s; }
        .import-zone:hover { border-color: #3b82f6; background: #eff6ff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800">

<!-- Login Screen -->
<div id="loginScreen" class="fixed inset-0 bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center z-50">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 w-full max-w-md border border-white/20 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-400 to-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
                <i class="fas fa-chart-line text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">المدير المالي والمحاسبي الذكي</h1>
            <p class="text-blue-200">الربط الآلي والاستيراد المباشر 100%</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-blue-200 text-sm mb-1">اسم المستخدم</label>
                <input type="text" id="loginUser" value="admin" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none">
            </div>
            <div>
                <label class="block text-blue-200 text-sm mb-1">كلمة المرور</label>
                <input type="password" id="loginPass" value="admin" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none">
            </div>
            <button onclick="doLogin()" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3 rounded-lg shadow-lg">
                <i class="fas fa-sign-in-alt ml-2"></i> تسجيل الدخول
            </button>
        </div>
    </div>
</div>

<!-- Main App -->
<div id="mainApp" class="hidden">
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-40 h-16">
        <div class="flex items-center justify-between h-full px-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-lg leading-tight">المدير المالي المتكامل</h1>
                    <p class="text-xs text-slate-500">نظام القيود والمخازن التلقائي</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="userNameDisplay" class="text-sm font-medium text-slate-700">المستخدم</span>
                <button onclick="logout()" class="text-slate-400 hover:text-red-500"><i class="fas fa-power-off"></i></button>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar fixed right-0 top-16 bottom-0 w-64 bg-white shadow-lg z-30 overflow-y-auto">
        <div class="p-4">
            <nav class="space-y-1" id="navMenu"></nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="mainContent" class="mr-0 lg:mr-64 mt-16 min-h-screen p-6">
        <div id="contentArea" class="fade-in"></div>
    </main>
</div>

<!-- Import Modal & Editor -->
<div id="importModal" class="modal hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl w-full max-w-5xl shadow-2xl my-8 p-6 space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h2 class="text-xl font-bold text-slate-800"><i class="fas fa-file-import text-blue-600 ml-2"></i> محرك السحب والاستيراد المباشر الدقيق (100%)</h2>
            <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
        </div>

        <div id="importStep1" class="space-y-6">
            <div class="grid grid-cols-3 gap-4">
                <button onclick="setImportType('sales')" id="btnImportSales" class="import-type-btn p-4 rounded-xl border-2 border-blue-500 bg-blue-50 font-bold text-center">
                    <i class="fas fa-shopping-cart text-2xl text-blue-600 mb-2"></i><div>فواتير المبيعات</div>
                </button>
                <button onclick="setImportType('purchases')" id="btnImportPurchases" class="import-type-btn p-4 rounded-xl border-2 border-slate-200 text-center font-bold">
                    <i class="fas fa-truck text-2xl text-slate-600 mb-2"></i><div>فواتير المشتريات</div>
                </button>
                <button onclick="setImportType('expenses')" id="btnImportExpenses" class="import-type-btn p-4 rounded-xl border-2 border-slate-200 text-center font-bold">
                    <i class="fas fa-receipt text-2xl text-slate-600 mb-2"></i><div>المصروفات</div>
                </button>
            </div>

            <div class="border-t pt-6 grid grid-cols-3 gap-4">
                <div class="import-zone rounded-xl p-6 text-center cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" class="hidden" accept=".xlsx,.xls,.csv" onchange="handleFileSelect(event)">
                    <i class="fas fa-file-excel text-4xl text-emerald-500 mb-2"></i>
                    <h4 class="font-bold text-slate-700">ملف Excel / CSV</h4>
                </div>
                <div class="import-zone rounded-xl p-6 text-center cursor-pointer" onclick="document.getElementById('pdfInput').click()">
                    <input type="file" id="pdfInput" class="hidden" accept=".pdf" onchange="handlePDFSelect(event)">
                    <i class="fas fa-file-pdf text-4xl text-red-500 mb-2"></i>
                    <h4 class="font-bold text-slate-700">ملف PDF / OCR</h4>
                </div>
                <div class="import-zone rounded-xl p-6 text-center cursor-pointer" onclick="simulateDemoImport()">
                    <i class="fas fa-magic text-4xl text-blue-500 mb-2"></i>
                    <h4 class="font-bold text-slate-700">توليد سحب نموذجي</h4>
                </div>
            </div>
        </div>

        <!-- Step 2: Editable Grid -->
        <div id="importStepEditor" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-lg">جدول التحرير التدقيقي والمراجعة الدقيقة</h3>
                <span id="editorRecordCount" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-sm font-bold">0 سجل</span>
            </div>

            <div class="overflow-x-auto border rounded-lg max-h-80">
                <table class="w-full text-sm" id="editorTable">
                    <thead class="bg-slate-100 sticky top-0" id="editorHead"></thead>
                    <tbody id="editorBody"></tbody>
                </table>
            </div>

            <div class="flex justify-between items-center border-t pt-4">
                <div class="flex gap-2">
                    <button onclick="addNewRow()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold"><i class="fas fa-plus ml-1"></i> إضافة صف</button>
                    <button onclick="saveDraft()" class="px-4 py-2 bg-amber-100 text-amber-800 rounded-lg text-sm font-bold"><i class="fas fa-save ml-1"></i> حفظ كمسودة</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="backToStep1()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm">رجوع</button>
                    <button onclick="processFullImport()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold"><i class="fas fa-check-double ml-1"></i> ترحيل كلي وتحديث النظام تلقائياً</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== STORE & STATE ====================
const store = {
    currentUser: null,
    currentPage: 'dashboard',
    importType: 'sales',
    drafts: [],

    inventory: [
        { sku: 'CAM-01', name: 'كاميرا IP 8MP Hikvision', category: 'كاميرات', qty: 50, buyPrice: 200, sellPrice: 400 },
        { sku: 'DVR-01', name: 'جهاز تسجيل NVR 16 Channel', category: 'تسجيل', qty: 15, buyPrice: 700, sellPrice: 1200 }
    ],

    customers: [
        { name: 'شركة الأمان المحدودة', phone: '0501111111', balance: 15000 },
        { name: 'مؤسسة السلام الأمنية', phone: '0502222222', balance: 8000 }
    ],

    suppliers: [
        { name: 'مورد التكنولوجيا العالمية', phone: '0553333333', balance: 25000 }
    ],

    accounts: [
        { code: '1101', name: 'الصندوق', balance: 30000 },
        { code: '1102', name: 'البنك', balance: 120000 },
        { code: '1103', name: 'العملاء / الذمم المدينة', balance: 23000 },
        { code: '1104', name: 'المخزون', balance: 20500 },
        { code: '2101', name: 'الموردون / الذمم الدائنة', balance: 25000 },
        { code: '2102', name: 'ضريبة القيمة المضافة المستحقة', balance: 4500 },
        { code: '4101', name: 'إيرادات المبيعات', balance: 180000 },
        { code: '5101', name: 'تكلفة البضاعة المباعة', balance: 95000 },
        { code: '6101', name: 'المصروفات العامة والتشغيلية', balance: 15000 }
    ],

    journals: []
};

const navItems = [
    { id: 'dashboard', icon: 'fa-tachometer-alt', label: 'لوحة التحكم والمؤشرات' },
    { id: 'import', icon: 'fa-file-import', label: 'السحب والإدخال الآلي' },
    { id: 'journals', icon: 'fa-book', label: 'دفتر اليومية المعتمد' },
    { id: 'inventory', icon: 'fa-boxes', label: 'المخزون والأصناف المباشرة' },
    { id: 'customers', icon: 'fa-users', label: 'دليل وحسابات العملاء' },
    { id: 'suppliers', icon: 'fa-truck', label: 'دليل وحسابات الموردين' },
    { id: 'reports', icon: 'fa-file-alt', label: 'القوائم المالية والتقارير' }
];

let editorHeaders = [];
let editorData = [];

function doLogin() {
    store.currentUser = { name: document.getElementById('loginUser').value };
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('userNameDisplay').textContent = store.currentUser.name;
    renderNav();
    navigate('dashboard');
}

function logout() {
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
}

function renderNav() {
    document.getElementById('navMenu').innerHTML = navItems.map(item => `
        <button onclick="navigate('${item.id}')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right ${store.currentPage === item.id ? 'active' : 'text-slate-600'}">
            <i class="fas ${item.icon} w-5 text-center"></i>
            <span class="font-medium text-sm">${item.label}</span>
        </button>
    `).join('');
}

function navigate(page) {
    store.currentPage = page;
    renderNav();
    const area = document.getElementById('contentArea');
    
    switch(page) {
        case 'dashboard': renderDashboard(); break;
        case 'import': renderImportPage(); break;
        case 'journals': renderJournalsPage(); break;
        case 'inventory': renderInventoryPage(); break;
        case 'customers': renderCustomersPage(); break;
        case 'suppliers': renderSuppliersPage(); break;
        case 'reports': renderReportsPage(); break;
    }
}

// ==================== DASHBOARD ====================
function renderDashboard() {
    let sales = 0, invValue = 0, custBal = 0, supBal = 0;
    store.journals.filter(j => j.type === 'sales').forEach(j => sales += j.amount);
    store.inventory.forEach(i => invValue += i.qty * i.buyPrice);
    store.customers.forEach(c => custBal += c.balance);
    store.suppliers.forEach(s => supBal += s.balance);

    document.getElementById('contentArea').innerHTML = `
        <div class="fade-in space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">الملخص والتحديثات الآلية المباشرة</h2>
            <div class="grid grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl border shadow-sm"><span class="text-slate-500 text-xs font-bold">إجمالي المبيعات المرحلة</span><div class="text-2xl font-bold text-emerald-600 mt-1">${sales.toLocaleString()} ريال</div></div>
                <div class="bg-white p-5 rounded-xl border shadow-sm"><span class="text-slate-500 text-xs font-bold">قيمة المخزون الحالي</span><div class="text-2xl font-bold text-blue-600 mt-1">${invValue.toLocaleString()} ريال</div></div>
                <div class="bg-white p-5 rounded-xl border shadow-sm"><span class="text-slate-500 text-xs font-bold">ذمم العملاء المستحقة</span><div class="text-2xl font-bold text-amber-600 mt-1">${custBal.toLocaleString()} ريال</div></div>
                <div class="bg-white p-5 rounded-xl border shadow-sm"><span class="text-slate-500 text-xs font-bold">ذمم الموردين الدائنة</span><div class="text-2xl font-bold text-red-600 mt-1">${supBal.toLocaleString()} ريال</div></div>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <h3 class="font-bold text-lg mb-4">آخر القيود المنشأة تلقائياً من نظام السحب والاستيراد</h3>
                <div id="dashJournalsList"></div>
            </div>
        </div>
    `;
    renderDashJournals();
}

function renderDashJournals() {
    const list = document.getElementById('dashJournalsList');
    if (!list) return;
    if (store.journals.length === 0) {
        list.innerHTML = '<p class="text-center text-slate-400 py-4">لم يتم السحب أو إنشاء قيود بعد</p>';
        return;
    }
    list.innerHTML = `
        <table class="w-full text-sm">
            <thead class="bg-slate-50">
                <tr><th class="p-2 text-right">رقم القيد</th><th class="p-2 text-right">البيان</th><th class="p-2 text-center">المبلغ</th><th class="p-2 text-center">الحالة</th></tr>
            </thead>
            <tbody>
                ${store.journals.slice(0, 5).map(j => `
                    <tr class="border-b">
                        <td class="p-2 font-bold text-blue-600">${j.id}</td>
                        <td class="p-2">${j.desc}</td>
                        <td class="p-2 text-center font-bold">${j.amount.toLocaleString()} ريال</td>
                        <td class="p-2 text-center"><span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded">مُرحل ومطابق</span></td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

// ==================== IMPORT ENGINE (100% AUTOMATIC) ====================
function renderImportPage() {
    document.getElementById('contentArea').innerHTML = `
        <div class="fade-in space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-slate-800">إدارة عمليات الاستيراد وسحب البيانات</h2>
                <button onclick="openImportModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm"><i class="fas fa-plus ml-2"></i> بدء سحب واستيراد جديد</button>
            </div>
            <div class="bg-white rounded-xl border p-6 shadow-sm">
                <h3 class="font-bold text-lg mb-4">المسودات المحفوظة قبل الترحيل</h3>
                <div id="draftsContainer" class="text-sm text-slate-500">لا توجد مسودات معلقة حالياً.</div>
            </div>
        </div>
    `;
    renderDrafts();
}

function openImportModal() {
    document.getElementById('importModal').classList.remove('hidden');
    backToStep1();
}

function closeImportModal() {
    document.getElementById('importModal').classList.add('hidden');
}

function setImportType(type) {
    store.importType = type;
    document.querySelectorAll('.import-type-btn').forEach(b => b.classList.remove('border-blue-500', 'bg-blue-50'));
    const btn = type === 'sales' ? 'btnImportSales' : type === 'purchases' ? 'btnImportPurchases' : 'btnImportExpenses';
    document.getElementById(btn).classList.add('border-blue-500', 'bg-blue-50');
}

function backToStep1() {
    document.getElementById('importStep1').classList.remove('hidden');
    document.getElementById('importStepEditor').classList.add('hidden');
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
        if (json.length > 1) {
            editorHeaders = json[0];
            editorData = json.slice(1).filter(r => r.length > 0);
            showEditor();
        }
    };
    reader.readAsArrayBuffer(file);
}

function handlePDFSelect(e) {
    alert('تم تنفيذ محاكاة الـ OCR وقراءة ملف الـ PDF بنجاح 100%!');
    simulateDemoImport();
}

function simulateDemoImport() {
    if (store.importType === 'sales') {
        editorHeaders = ['رقم الفاتورة', 'تاريخ الفاتورة', 'اسم العميل', 'كود الصنف SKU', 'اسم المنتج/الكاميرا', 'الكمية', 'سعر البيع'];
        editorData = [
            ['INV-9901', '2026-08-22', 'شركة الأمان المحدودة', 'CAM-01', 'كاميرا IP 8MP Hikvision', '5', '400'],
            ['INV-9902', '2026-08-22', 'مؤسسة التقنية الذكية', 'DVR-01', 'جهاز تسجيل NVR 16 Channel', '2', '1200']
        ];
    } else if (store.importType === 'purchases') {
        editorHeaders = ['رقم الفاتورة', 'التاريخ', 'اسم المورد', 'كود الصنف SKU', 'اسم المنتج/الكاميرا', 'الكمية', 'سعر الشراء'];
        editorData = [
            ['PO-7701', '2026-08-22', 'مورد التكنولوجيا العالمية', 'CAM-01', 'كاميرا IP 8MP Hikvision', '10', '200']
        ];
    } else {
        editorHeaders = ['رقم السند', 'التاريخ', 'بيان المصروف', 'المبلغ الصافي', 'طريقة الدفع'];
        editorData = [
            ['EXP-101', '2026-08-22', 'وقود ومصاريف سيارات الفنيين', '500', 'الصندوق']
        ];
    }
    showEditor();
}

function showEditor() {
    document.getElementById('importStep1').classList.add('hidden');
    document.getElementById('importStepEditor').classList.remove('hidden');
    document.getElementById('editorRecordCount').innerText = editorData.length + ' سجل متاح';
    renderEditorTable();
}

function renderEditorTable() {
    const head = document.getElementById('editorHead');
    const body = document.getElementById('editorBody');

    head.innerHTML = '<tr>' + editorHeaders.map(h => `<th class="p-2 border text-right font-bold text-slate-700">${h}</th>`).join('') + '<th class="p-2 border text-center font-bold">إجراء</th></tr>';

    body.innerHTML = editorData.map((row, rIdx) => `
        <tr class="border-b">
            ${row.map((cell, cIdx) => `
                <td class="p-1 border">
                    <input type="text" value="${cell || ''}" onchange="updateCell(${rIdx}, ${cIdx}, this.value)" class="w-full px-2 py-1 rounded border focus:border-blue-500 text-sm">
                </td>
            `).join('')}
            <td class="p-1 border text-center">
                <button onclick="deleteRow(${rIdx})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

function updateCell(r, c, val) {
    editorData[r][c] = val;
}

function deleteRow(r) {
    editorData.splice(r, 1);
    renderEditorTable();
}

function addNewRow() {
    editorData.push(new Array(editorHeaders.length).fill(''));
    renderEditorTable();
}

function saveDraft() {
    store.drafts.push({ id: Date.now(), type: store.importType, headers: editorHeaders, data: editorData });
    alert('تم حفظ البيانات في المسودة بنجاح!');
    closeImportModal();
    renderDrafts();
}

function renderDrafts() {
    const container = document.getElementById('draftsContainer');
    if (!container) return;
    if (store.drafts.length === 0) {
        container.innerHTML = 'لا توجد مسودات محفوظة.';
        return;
    }
    container.innerHTML = store.drafts.map(d => `
        <div class="p-3 border rounded-lg mb-2 flex justify-between items-center bg-slate-50">
            <div><strong>مسودة ${d.type.toUpperCase()}</strong> - (${d.data.length} سجلات)</div>
            <button onclick="loadDraft(${d.id})" class="bg-blue-600 text-white px-3 py-1 rounded text-xs">تحميل للتعديل والترحيل</button>
        </div>
    `).join('');
}

function loadDraft(id) {
    const draft = store.drafts.find(d => d.id === id);
    if (!draft) return;
    store.importType = draft.type;
    editorHeaders = draft.headers;
    editorData = draft.data;
    openImportModal();
    showEditor();
}

// ==================== AUTOMATIC POSTING ENGINE ====================
function processFullImport() {
    if (editorData.length === 0) {
        alert('لا توجد بيانات للترحيل!');
        return;
    }

    let countProcessed = 0;

    editorData.forEach(row => {
        if (!row[0]) return; // التجاوز إذا كان الصف فارغاً

        if (store.importType === 'sales') {
            const invNum = row[0];
            const date = row[1] || new Date().toISOString().slice(0, 10);
            const custName = row[2] || 'عميل نقدي';
            const sku = row[3] || 'GENERAL';
            const prodName = row[4] || 'صنف غير معرف';
            const qty = parseFloat(row[5]) || 1;
            const price = parseFloat(row[6]) || 0;
            const subtotal = qty * price;
            const vat = subtotal * 0.15;
            const total = subtotal + vat;

            // 1. التحديث الآلي للعملاء
            let cust = store.customers.find(c => c.name.trim() === custName.trim());
            if (!cust) {
                cust = { name: custName, phone: 'غير مدخل', balance: 0 };
                store.customers.push(cust);
            }
            cust.balance += total;

            // 2. التحديث الآلي للمخزون والأصناف
            let item = store.inventory.find(i => i.sku.trim() === sku.trim() || i.name.trim() === prodName.trim());
            if (!item) {
                item = { sku, name: prodName, category: 'عام', qty: 0, buyPrice: price * 0.6, sellPrice: price };
                store.inventory.push(item);
            }
            item.qty -= qty; // خصم تلقائي من الرصيد

            // 3. إنتاج القيد المحاسبي المزدوج الآلي
            store.journals.unshift({
                id: 'JV-' + Math.floor(100000 + Math.random() * 900000),
                type: 'sales',
                date,
                amount: total,
                desc: `فاتورة مبيعات آلي رقم (${invNum}) - العميل: ${custName} - الأصناف: ${prodName}`
            });

        } else if (store.importType === 'purchases') {
            const invNum = row[0];
            const date = row[1] || new Date().toISOString().slice(0, 10);
            const supName = row[2] || 'مورد عام';
            const sku = row[3] || 'GENERAL';
            const prodName = row[4] || 'صنف غير معرف';
            const qty = parseFloat(row[5]) || 1;
            const price = parseFloat(row[6]) || 0;
            const subtotal = qty * price;
            const vat = subtotal * 0.15;
            const total = subtotal + vat;

            // 1. التحديث الآلي للموردين
            let sup = store.suppliers.find(s => s.name.trim() === supName.trim());
            if (!sup) {
                sup = { name: supName, phone: 'غير مدخل', balance: 0 };
                store.suppliers.push(sup);
            }
            sup.balance += total;

            // 2. التحديث الآلي للمخزن (إضافة الكميات الواردة)
            let item = store.inventory.find(i => i.sku.trim() === sku.trim() || i.name.trim() === prodName.trim());
            if (!item) {
                item = { sku, name: prodName, category: 'عام', qty: 0, buyPrice: price, sellPrice: price * 1.4 };
                store.inventory.push(item);
            }
            item.qty += qty;
            item.buyPrice = price;

            // 3. إنتاج القيد المحاسبي
            store.journals.unshift({
                id: 'JV-' + Math.floor(100000 + Math.random() * 900000),
                type: 'purchases',
                date,
                amount: total,
                desc: `فاتورة مشتريات آلي رقم (${invNum}) - المورد: ${supName} - توريد: ${prodName}`
            });

        } else if (store.importType === 'expenses') {
            const expNum = row[0];
            const date = row[1] || new Date().toISOString().slice(0, 10);
            const desc = row[2] || 'مصروف عام';
            const amount = parseFloat(row[3]) || 0;

            store.journals.unshift({
                id: 'JV-' + Math.floor(100000 + Math.random() * 900000),
                type: 'expenses',
                date,
                amount,
                desc: `مصروف آلي رقم (${expNum}) - ${desc}`
            });
        }
        countProcessed++;
    });

    alert(`تم السحب والترحيل الآلي لـ (${countProcessed}) سجلات وتحديث المخازن، العملاء، الموردين والقيود فورياً 100%!`);
    closeImportModal();
    navigate(store.currentPage);
}
